<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>根系三维测量器</title>
<link rel="icon" href="data:,">
<style>
:root{--ink:#141414;--mut:#8a8a86;--line:#e6e6e2;--fill:#f0f0ec;--bad:#b42318}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#fbfbfa;color:var(--ink);font:15px/1.65 system-ui}
main{max-width:820px;margin:0 auto;padding:0 24px 46px}
header{display:flex;align-items:baseline;gap:14px;border-bottom:2px solid var(--ink);padding:30px 0 14px;max-width:820px;margin:0 auto;flex-wrap:wrap}
header h1{font-size:21px;margin:0;font-weight:500;letter-spacing:.02em}
header .sub{color:var(--mut);font-size:13px}
header .sp{flex:1}
header .tools{display:flex;gap:14px;align-items:baseline}
header a{color:var(--ink);font-size:13px;text-decoration:underline;text-underline-offset:3px}
button{font:inherit;background:transparent;border:1px solid var(--ink);color:var(--ink);border-radius:2px;padding:8px 18px;cursor:pointer}
button:hover{background:var(--fill)}
button.primary{background:var(--ink);color:#fff;padding:10px 26px}
button.primary:hover{background:#2b2b2b}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:6px 2px}
textarea{border:1px solid var(--line);background:#fff;padding:10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
.sec{padding:24px 0 26px;border-bottom:1px solid var(--line)}
.tag{font-size:12px;letter-spacing:.14em;color:var(--mut);margin:0 0 14px}
.tag b{color:var(--ink);font-weight:500;margin-right:10px;font-family:ui-monospace,Consolas,monospace}
.hint{color:var(--mut);font-size:13px;margin:6px 0 12px}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;margin-top:16px;border:1px solid var(--line);border-right:0;width:fit-content;max-width:100%}
.chips .none{color:var(--mut);font-size:14px;padding:9px 16px;border-right:1px solid var(--line);background:#fff}
.chip{padding:9px 16px;border-right:1px solid var(--line);font-size:14px;background:#fff;color:var(--mut);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{color:var(--ink);background:var(--fill);box-shadow:inset 0 -2px 0 var(--ink)}
.chip small{font-size:12px;margin-left:6px}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:4px}
.fields label{font-size:12px;letter-spacing:.06em;color:var(--mut);display:block;margin-bottom:5px}
.fields input,.fields select{width:100%}
#mesh_settings{margin-top:18px}
#message{margin-top:14px;font-size:14px;min-height:22px;white-space:pre-wrap}
#message.bad{color:var(--bad)}
#message.ok{color:var(--ink)}
.strips{margin-top:14px}
.strip{font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;padding:10px 14px;background:var(--fill);border-left:3px solid var(--ink);display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.strip .ok{color:var(--ink)}
.strip .bad{color:var(--bad)}
.strip .phase{font-family:inherit}
.strip .elapsed{color:var(--mut)}
.strip button{padding:3px 12px;font-size:12.5px}
.strip a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.results .rowitem{display:flex;gap:12px;align-items:baseline;padding:12px 2px;border-bottom:1px solid var(--line);font-size:14px}
.results .rowitem b{font-weight:500;font-family:ui-monospace,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.results .badge{color:var(--mut);font-size:12px}
.results .rowitem button{margin-left:auto;padding:5px 14px;font-size:13px}
.results .none{color:var(--mut);font-size:14px;padding:8px 0}
iframe{width:100%;height:78vh;border:1px solid var(--ink);margin-top:18px;background:#101820}
details{color:var(--mut);font-size:13px;margin-top:14px}
details summary{cursor:pointer}
details .row{margin-top:10px}
details .row input{flex:1;min-width:240px;border-bottom-color:var(--ink)}
footer{color:var(--mut);font-size:12px;margin-top:20px}
a{color:var(--ink)}
@media(max-width:640px){.fields{grid-template-columns:1fr}}
</style></head><body>
<header><h1>根系三维测量器</h1><span class="sub">三维根系实体 · 长度 / 半径 / 体积 / 形态指标</span><span class="sp"></span>
<span class="tools"><button id="open_workspace" hidden>打开结果文件夹</button><a href="/">高级模式 ↗</a></span></header>
<main>
<section class="sec"><p class="tag"><b>01</b>选择模型</p>
<p class="hint">支持实体目录、entity_prediction.json 或闭合三角网格 PLY。原实体不会被修改。</p>
<div class="row"><button class="primary" id="pick">选择模型文件</button><button id="demo" hidden>生成演示模型</button></div>
<div class="chips" id="entities"><span class="none">尚未载入模型。</span></div>
<details><summary>通过粘贴路径添加 +</summary>
<div class="row"><input id="entity_path" placeholder="粘贴实体目录、JSON 或 PLY 的完整路径"><button id="add_entity">载入</button></div>
</details></section>

<section class="sec"><p class="tag"><b>02</b>测量设置</p>
<div class="fields">
<div><label>比例尺 MM / 单位</label><input id="scale" type="number" min="0" step="any" placeholder="可留空"></div>
<div><label>竖直轴</label><select id="vertical_axis"><option value="z">Z 轴</option><option value="y">Y 轴</option><option value="x">X 轴</option></select></div>
<div><label>向下方向</label><select id="down_sign"><option value="-1">负方向向下</option><option value="1">正方向向下</option></select></div>
</div>
<div class="fields" id="mesh_settings" hidden>
<div><label>网格目标格距（模型单位）</label><input id="mesh_pitch" type="number" min="0" step="any" placeholder="依据输入特征尺度"></div>
<div style="grid-column:1/-1"><label>目标格距依据（必填）</label><input id="mesh_reason" placeholder="例如：输入网格面片约 0.05mm"></div>
</div>
<p class="hint" style="margin-top:10px">不知道比例尺就留空，结果使用模型单位；深度零点取实体最上边界。</p></section>

<section class="sec"><p class="tag"><b>03</b>开始测量</p>
<div class="row"><button class="primary" id="start" disabled>开始测量</button><span class="hint" style="margin:0">同一时间只运行一个测量任务，可随时取消。</span></div>
<div id="message"></div>
<div class="strips" id="jobs"></div>
<details><summary>批量测量（按顺序逐个测量多个实体）+</summary>
<textarea id="batch_inputs" rows="4" placeholder="每行一个实体目录或 entity_prediction.json 路径"></textarea>
<div class="row" style="margin-top:10px"><button id="batch_start">开始批量测量</button><span class="hint" style="margin:0">使用上方统一的比例尺和方向设置。</span></div>
<div class="strips" id="batches"></div>
</details></section>

<section class="sec" style="border-bottom:0"><p class="tag"><b>04</b>测量结果</p>
<div class="results" id="results"><span class="none">还没有结果。完成一次测量后会显示在这里，点击即可查看和交互。</span></div>
<iframe id="viewer" title="测量结果查看" hidden></iframe>
<footer>所有计算与查看均在本机完成，不连接网络。</footer></section>
</main>
<script>
const token='__LOCAL_TOKEN__',$=s=>document.querySelector(s);
const post=async(url,data)=>{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-Root-Local-Token':token},body:JSON.stringify(data||{})});const v=await r.json();if(!r.ok)throw Error(v.error||r.status);return v;};
const phases={mesh_resolution:'网格分辨率与相位挑战',mesh_axis_body:'网格中心线体部校正',load_entity:'读取原生实体',entity_loaded:'实体读取完成',skeleton:'自动提取中心线',skeleton_complete:'骨架生成完成',body_correction:'体部校正',graph_quotient:'保留真实环的图表示',junction_correction:'分叉原面校正',junction_correction_complete:'分叉校正完成',geometric_endpoints:'有限实体端部追踪',axis_candidate:'补充端部测量',axis_candidate_progress:'补充中心线与端点计算',axis_candidate_selected:'端部候选通过，继续测量',radius:'原实体截面半径',exports_and_original_boundary:'生成导出及边界显示',measurement_written:'保存测量结果',complete:'结果已生成',pipeline_blocked:'测量阻塞'};
const kinds={native_entity:'原生实体',triangle_ply:'三角网格'};
const provenance={inherited:'继承','reused_axis_new_sections':'复用轴 / 新截面','reused_mesh_target_new_challenges':'复用网格目标轴 / 新挑战'};
const provenanceText=value=>provenance[value]||'本次自动测量';
const hasBridge=()=>!!(window.pywebview&&window.pywebview.api);
const whenBridge=timeout=>new Promise(res=>{if(hasBridge())return res(true);const timer=setTimeout(()=>res(false),timeout||4000);window.addEventListener('pywebviewready',()=>{clearTimeout(timer);res(true);},{once:true});});
let selected='',pendingJob='',busy=false;
const msg=(text,cls)=>{$('#message').textContent=text||'';$('#message').className=cls||'';};
async function register(path){const v=await post('/api/register-entity',{path});selected=v.entity.id;if(hasBridge())window.pywebview.api.remember_entity(path);await refresh();return v.entity;}
async function openResult(id){const frame=$('#viewer');frame.hidden=false;frame.src='/result/'+id+'/';frame.scrollIntoView({behavior:'smooth',block:'start'});}
async function refresh(){try{const state=await fetch('/api/state').then(r=>r.json());
 const box=$('#entities');box.replaceChildren();
 if(!state.entities.length){const s=document.createElement('span');s.className='none';s.textContent='尚未载入模型。';box.append(s);}
 for(const value of state.entities){const chip=document.createElement('button');chip.className='chip'+(value.id===selected?' on':'');chip.style.maxWidth='100%';chip.textContent=value.label;const kind=document.createElement('small');kind.textContent=kinds[value.input_kind||'native_entity']||'';chip.append(kind);chip.onclick=()=>{selected=value.id;refresh();};box.append(chip);}
 const picked=state.entities.find(e=>e.id===selected);$('#mesh_settings').hidden=!picked||picked.input_kind!=='triangle_ply';
 busy=false;const jobs=$('#jobs');jobs.replaceChildren();
 for(const job of state.jobs){busy||=job.running;const item=document.createElement('div');item.className='strip';const p=job.progress||{};
  const name=document.createElement('span');name.textContent=job.entity_label;item.append(name);
  const phase=document.createElement('span');phase.className=job.running?'phase':'ok';phase.textContent=job.running?(phases[p.phase]||'准备中…'):job.supervision?.stop_reason==='USER_CANCELLED'?'已取消':job.measurement_blocked?'完整测量阻塞，保留部分结果':job.exit_code===0?'完成，结果已生成':'运行失败，日志已保留';item.append(phase);
  const extra=document.createElement('span');extra.className='elapsed';extra.textContent='· '+Math.round(job.elapsed_seconds)+' 秒'+(p.processed?' · '+p.processed+'/'+p.total:p.nodes_processed?' · '+p.nodes_processed+'/'+p.total_nodes:'');item.append(extra);
  if(job.running){const b=document.createElement('button');b.textContent='取消';b.onclick=async()=>{await post('/api/cancel',{job_id:job.id});await refresh();};item.append(b);}
  if(job.id===pendingJob&&!job.running&&job.result_id){pendingJob='';openResult(job.result_id);}
  jobs.append(item);}
 const batches=$('#batches');batches.replaceChildren();
 for(const batch of state.batches||[]){busy||=batch.running;const item=document.createElement('div');item.className='strip';
  const name=document.createElement('span');name.textContent='批量 '+batch.total+' 个';item.append(name);
  const phase=document.createElement('span');phase.className=batch.running?'phase':'ok';phase.textContent=batch.running?'正在计算第 '+((batch.progress.index??0)+1)+' 个':batch.summary?'完成 '+batch.summary.measurements.filter(r=>r.complete_length).length+'/'+batch.total+' 个完整几何轴':'执行失败，日志已保留';item.append(phase);
  if(batch.running){const b=document.createElement('button');b.textContent='取消';b.onclick=async()=>{await post('/api/cancel',{batch_id:batch.id});await refresh();};item.append(b);}
  if(batch.summary)for(const format of ['csv','json']){const a=document.createElement('a');a.href='/api/batches/'+batch.id+'/'+format;a.textContent='汇总 '+format.toUpperCase();item.append(a);}
  batches.append(item);}
 $('#start').disabled=busy||!selected;$('#batch_start').disabled=busy;$('#pick').disabled=busy;$('#demo').disabled=busy;
 const results=$('#results');results.replaceChildren();
 if(!state.deliveries.length){const s=document.createElement('span');s.className='none';s.textContent='还没有结果。完成一次测量后会显示在这里，点击即可查看和交互。';results.append(s);}
 for(const result of state.deliveries){const row=document.createElement('div');row.className='rowitem';
  const name=document.createElement('b');name.textContent=result.label;row.append(name);
  const badge=document.createElement('span');badge.className='badge';badge.textContent=provenanceText(result.provenance);row.append(badge);
  const view=document.createElement('button');view.textContent='查看';view.onclick=()=>openResult(result.id);row.append(view);
  results.append(row);}
 }catch(e){msg('读取状态失败：'+e.message,'bad');}}
$('#pick').onclick=async()=>{msg('');try{if(await whenBridge()){const path=await window.pywebview.api.pick_file();if(path){msg('正在载入所选模型…');await register(path);msg('已载入。','ok');}}else{const v=await post('/api/select-entity',{});if(v.entity){selected=v.entity.id;await refresh();}}}catch(e){msg(e.message,'bad');}};
$('#demo').onclick=async()=>{msg('');const button=$('#demo');button.disabled=true;msg('正在生成演示模型，几秒钟即可完成…');try{const v=await window.pywebview.api.generate_demo('straight');await register(v.entity_path);msg('演示模型已生成并载入，可以直接开始测量。','ok');}catch(e){msg('生成失败：'+e.message,'bad');}finally{button.disabled=false;await refresh();}};
$('#add_entity').onclick=async()=>{msg('');const path=$('#entity_path').value.trim();if(!path)return msg('请先粘贴模型路径。','bad');try{await register(path);$('#entity_path').value='';msg('已载入。','ok');}catch(e){msg(e.message,'bad');}};
$('#start').onclick=async()=>{msg('');try{const raw=$('#scale').value,pitch=$('#mesh_pitch').value;const job=await post('/api/jobs',{entity_id:selected,vertical_axis:$('#vertical_axis').value,down_sign:Number($('#down_sign').value),scale_mm:raw?Number(raw):null,mesh_target_pitch:pitch?Number(pitch):null,mesh_target_reason:$('#mesh_reason').value});pendingJob=job.job_id;msg('测量已开始，完成后自动打开结果。','ok');await refresh();}catch(e){msg(e.message,'bad');}};
$('#batch_start').onclick=async()=>{msg('');try{const inputs=$('#batch_inputs').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean),raw=$('#scale').value;if(!inputs.length)return msg('请先填写要测量的实体路径，每行一个。','bad');await post('/api/batches',{inputs,vertical_axis:$('#vertical_axis').value,down_sign:Number($('#down_sign').value),scale_mm:raw?Number(raw):null});msg('批量测量已开始。','ok');await refresh();}catch(e){msg(e.message,'bad');}};
$('#open_workspace').onclick=()=>window.pywebview.api.open_workspace();
document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;const href=a.getAttribute('href')||'';if(!(a.hasAttribute('download')||href.startsWith('/api/batches/')))return;if(hasBridge()&&window.pywebview.api.save_file){e.preventDefault();window.pywebview.api.save_file(href,(a.textContent||'download').trim());}},true);
whenBridge(3000).then(ok=>{if(!ok)return;$('#demo').hidden=false;$('#open_workspace').hidden=false;
 window.pywebview.api.recent_entities().then(async list=>{for(const path of list||[]){try{const v=await post('/api/register-entity',{path});if(!selected)selected=v.entity.id;}catch(e){try{await window.pywebview.api.forget_entity(path);}catch(_){break;}}}await refresh();});});
refresh();setInterval(refresh,2000);
</script></body></html>
